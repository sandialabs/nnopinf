CSV output interval: 1.e-5
CSV write sidesets: true
Exodus output interval: 5.e-5
mass matrix file: "mass.npz"
input mesh file: ../../../input/torsion.g
model:
  material: {blocks: {torsion: hyperelastic}, hyperelastic: {Poisson's ratio: 0.25, density: 1000.0, elastic modulus: 1000000000.0, model: neohookean}}
  type: quadratic opinf rom
  model-file: ../../../training/quadratic-opinf-operator-16.npz
  basis inner product: mass
