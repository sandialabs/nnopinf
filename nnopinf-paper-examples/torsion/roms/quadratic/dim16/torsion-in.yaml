solver: {absolute tolerance: 1.0e-06, maximum iterations: 128, minimum iterations: 1, relative tolerance: 1.0e-10, step: full Newton, type: Hessian minimizer}
time integrator: {final time: 5.0e-3, initial time: 0.0, time step: 1.0e-05, type: Newmark, "\u03B2": 0.25, "\u03B3": 0.5}
type: single
